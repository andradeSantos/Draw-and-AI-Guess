services:
  postgres:
    image: postgres:16-alpine
    container_name: draw_ia_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-museu_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-museu_pass_local}
      POSTGRES_DB: ${POSTGRES_DB:-draw_ia_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-museu_user} -d ${POSTGRES_DB:-draw_ia_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
